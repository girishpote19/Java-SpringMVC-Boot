version: '3.8'

services:
  web:
    build: .
    container_name: springmvc-app
    ports:
      - "8080:8081"
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Root
      MYSQL_DATABASE: bookcrud
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
